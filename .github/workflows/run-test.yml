name: Run tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"
      - name: install
        run: yarn install --frozen-lockfile
      - name: run unit test
        working-directory: ./packages/view360
        run: yarn test
